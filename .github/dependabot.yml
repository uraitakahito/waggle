# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
#
# Dependabot が読むのは **default branch (main) に置かれたこのファイル** だけ。
# `target-branch` は「PR をどこへ出すか」を指すだけで、設定の置き場所ではない。
# develop にだけ置いても効かないので、両方に同じものを入れてある。
#
# この repo は pnpm の workspace で、lockfile は root の pnpm-lock.yaml 1 本だけ。
# それでも entry は package ごとに分けている:
#   /            … waggle 本体
#   /docs-site   … Astro のドキュメントサイト
# 分ける理由は lockfile ではなく **groups と上限**。root の entry は production /
# development で分けるが、docs-site の依存はどちらでもない (ドキュメントの
# ビルド専用) ので、まとめて 1 本にしたい。
#
# ecosystem は pnpm でも `npm`。dependabot は pnpm-lock.yaml をこの ecosystem で
# 扱う。
version: 2
updates:
  # ── アプリ本体 ──
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    # 版が枯れてから PR 化する(supply-chain 対策)。security 更新には適用されない
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 3
    versioning-strategy: increase
    labels:
      - dependencies
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development

  # ── docs-site (Astro) ──
  #
  # 本番コードではなくドキュメントのビルド専用なので、種類で分けずに **全部 1 本**
  # にまとめる。上限も 1。entry ごとに open-pull-requests-limit が効くため、
  # ここを 3 にすると npm だけで 1 repo 最大 6 本になり、溜まる状態を再生産する。
  - package-ecosystem: npm
    directory: /docs-site
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 1
    versioning-strategy: increase
    labels:
      - dependencies
      - docs
    groups:
      docs-site:
        patterns:
          - "*"

  # ── GitHub Actions ──
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    # github-actions は default-days のみ対応
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    labels:
      - ci
    groups:
      actions:
        patterns:
          - "*"

  # ── Docker base image ──
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    labels:
      - docker
