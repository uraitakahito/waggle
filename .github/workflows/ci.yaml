name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: waggle
          POSTGRES_PASSWORD: waggle
          POSTGRES_DB: waggle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waggle -d waggle"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://waggle:waggle@localhost:5432/waggle

    steps:
      - uses: actions/checkout@v7

      # setup-node より前に置くこと。cache: 'pnpm' は pnpm が PATH に居ないと
      # ストアの場所を解決できない。版は package.json の packageManager から読む。
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Apply migrations
        run: node dist/db/migrate.js up

      - name: Migration round-trip (down then up)
        run: |
          node dist/db/migrate.js down
          node dist/db/migrate.js up

      - name: Proto drift check
        run: pnpm run proto:check

      # Separate from the drift check: that one asks whether the generated tree
      # matches the .proto, this one asks whether what it imports will still be
      # installed in the prod-only layer the runtime image is built from.
      # pnpm does not hoist, so a package that only resolved by hoisting now
      # fails during development too — this stays as the second line of defence.
      - name: Generated dependency check
        run: pnpm run proto:check-deps

      # `fga model test` runs the model in-process — no OpenFGA server needed.
      # These assertions are what stands between a one-line edit to
      # `fga/model.fga` and another organization's archives becoming readable,
      # so they run on every PR rather than only when the stack is up.
      - name: Install OpenFGA CLI
        run: |
          curl -fsSL "https://github.com/openfga/cli/releases/download/v0.7.19/fga_0.7.19_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin fga

      - name: Authorization model tests
        run: pnpm run fga:test
