name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: waggle
          POSTGRES_PASSWORD: waggle
          POSTGRES_DB: waggle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waggle -d waggle"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://waggle:waggle@localhost:5432/waggle

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Apply migrations
        run: node dist/db/migrate.js up

      - name: Migration round-trip (down then up)
        run: |
          node dist/db/migrate.js down
          node dist/db/migrate.js up

      - name: OpenAPI drift check
        run: npm run openapi:check

      # `fga model test` runs the model in-process — no OpenFGA server needed.
      # These assertions are what stands between a one-line edit to
      # `fga/model.fga` and another organization's archives becoming readable,
      # so they run on every PR rather than only when the stack is up.
      - name: Install OpenFGA CLI
        run: |
          curl -fsSL "https://github.com/openfga/cli/releases/download/v0.7.19/fga_0.7.19_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin fga

      - name: Authorization model tests
        run: npm run fga:test
