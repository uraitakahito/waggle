name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # vendored proto が submodule の proto と一致しているか。
  #
  # `proto:sync` は submodule から `proto/` へ cp するだけなので、submodule を上げても
  # sync を忘れれば古い契約のまま喋る。実際に一度それで通り抜けている。
  #
  # `check` job とは別に切ってあるのは submodule が要るから —— BrowserHive は private
  # なので既定の GITHUB_TOKEN では clone できず、App token を鋳造する手順が要る。
  # それを毎 PR の全部の検査に背負わせるより、この 1 本だけに閉じるほうが安い。
  #
  # **検査であって修正ではない。** `pnpm run proto:generate` は頭で sync するが、
  # ここで呼ぶのは `proto:diff` のほう。sync を通してから比べると、ずれを自分で直して
  # しまって必ず緑になる (実際にその形で書いて、反証したら素通りした)。
  proto-sync:
    name: Proto sync check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # 手順の由来は docs.yaml の同じブロックを参照。App は repo をまたいで共有する
      # 前提で名前が付いている。
      - uses: actions/create-github-app-token@v3
        id: submodule-token
        with:
          client-id: ${{ vars.SUBMODULE_CLIENT_ID }}
          private-key: ${{ secrets.SUBMODULE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            waggle
            browserhive
          permission-contents: read
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ steps.submodule-token.outputs.token }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Vendored proto matches the submodule
        run: pnpm run proto:diff

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: waggle
          POSTGRES_PASSWORD: waggle
          POSTGRES_DB: waggle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waggle -d waggle"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://waggle:waggle@localhost:5432/waggle

    steps:
      - uses: actions/checkout@v7

      # setup-node より前に置くこと。cache: 'pnpm' は pnpm が PATH に居ないと
      # ストアの場所を解決できない。版は package.json の packageManager から読む。
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Apply migrations
        run: node dist/db/migrate.js up

      - name: Migration round-trip (down then up)
        run: |
          node dist/db/migrate.js down
          node dist/db/migrate.js up

      - name: Proto drift check
        run: pnpm run proto:check

      # Separate from the drift check: that one asks whether the generated tree
      # matches the .proto, this one asks whether what it imports will still be
      # installed in the prod-only layer the runtime image is built from.
      # pnpm does not hoist, so a package that only resolved by hoisting now
      # fails during development too — this stays as the second line of defence.
      - name: Generated dependency check
        run: pnpm run proto:check-deps

      # `fga model test` runs the model in-process — no OpenFGA server needed.
      # These assertions are what stands between a one-line edit to
      # `fga/model.fga` and another organization's archives becoming readable,
      # so they run on every PR rather than only when the stack is up.
      - name: Install OpenFGA CLI
        run: |
          curl -fsSL "https://github.com/openfga/cli/releases/download/v0.7.19/fga_0.7.19_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin fga

      # `pnpm run <script> -- --flag` は npm と違って `--` をそのまま引数として
      # 渡す。waggle の CLI は allowExcessArguments(false) なので、それは
      # "too many arguments" で即死する。npm から移したときの書き換え漏れは
      # ドキュメントの中でしか起きず、テストも lint も届かないので、ここで見る。
      - name: No npm-style `--` before flags
        run: |
          if grep -rn 'pnpm run [a-z:]* -- -' \
               --exclude-dir=node_modules --exclude-dir=.git \
               --exclude-dir=.upstream --exclude-dir=dist .; then
            echo "::error::pnpm では -- が literal で渡ります。落としてください。"
            exit 1
          fi

      - name: Authorization model tests
        run: pnpm run fga:test
