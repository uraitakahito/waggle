openapi: 3.1.0
info:
  title: BrowserHive Capture API
  version: 1.0.0
  description: |
    Web page capture API. Submits URLs to capture as PNG/WebP screenshots,
    HTML, or MHTML (single-file archive). Uses fire-and-forget
    pattern: requests are accepted immediately and processed asynchronously
    by the capture coordinator.
  license:
    name: The Unlicense
    identifier: Unlicense
# servers[0].url is the source of truth for the SDK's default baseUrl.
# @hey-api/openapi-ts bakes it into src/http/generated/client.gen.ts at
# generation time, so example clients (e.g. examples/data-client.ts)
# inherit it without a hardcoded fallback.
servers:
  - url: http://localhost:8080
    description: Local development server
# The Capture API is unauthenticated; declare it explicitly so the
# `security-defined` lint rule passes without per-operation duplication.
security: []
paths:
  /v1/captures:
    post:
      operationId: submitCapture
      summary: Submit a capture request
      description: |
        Accept a capture request for a single URL. Returns 202 immediately
        on acceptance; the actual capture is processed asynchronously.

        The `wacz` capture format records every HTTP exchange Chromium
        performs during the capture (including resources loaded later by
        scroll-triggered lazy loaders) into a [WACZ archive](https://specs.webrecorder.net/wacz/1.0.0/)
        replayable in [ReplayWeb.page](https://replayweb.page/). Server-state
        dependent traffic — auth flows with expiring tokens, live
        WebSocket / SSE streams, WebRTC — is **not** in scope: the WARC
        records the original exchange but replay cannot reproduce values
        that change every load.

        ## Filename format

        Captured artifacts are uploaded to the configured S3-compatible
        bucket as `s3://<bucket>/[<keyPrefix>/]<filename>`. The filename
        is derived from the task identifiers as follows:

        | Case | Format | Example |
        |------|--------|---------|
        | With labels | `{taskId}_{labels}.{ext}` | `550e8400-..._my-label.png` |
        | Without labels | `{taskId}.{ext}` | `550e8400-....png` |
        | Labels + correlationId | `{taskId}_{correlationId}_{labels}.{ext}` | `550e8400-..._abc123_my-label.png` |
        | correlationId only | `{taskId}_{correlationId}.{ext}` | `550e8400-..._abc123.png` |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureRequest"
            examples:
              dismissBanners:
                summary: Dismiss cookie-consent banners
                description: |
                  Captures The Guardian (which uses Sourcepoint as its
                  consent-management platform). With `dismissBanners: true`
                  the consent dialog — and any large fixed/sticky overlay
                  caught by the heuristic fallback — are removed before the
                  screenshot is taken. See the `dismissBanners` field of
                  `CaptureRequest` for the resulting `dismissReport` shape.
                value:
                  url: https://www.theguardian.com
                  labels: [guardian]
                  captureFormats:
                    png: true
                    webp: false
                    html: false
                    links: false
                    mhtml: false
                    wacz: false
                  dismissBanners: true
              acceptLanguageJa:
                summary: Capture the Japanese variant of a multilingual site
                description: |
                  Sends `Accept-Language: ja-JP,ja;q=0.9,en-US;q=0.8,en;q=0.7`
                  on the upstream request so sites that vary content by language
                  (Google, Wikipedia, locale-redirecting corporate sites, etc.)
                  return the Japanese rendition.
                value:
                  url: https://www.google.com/
                  labels: [google, ja]
                  captureFormats:
                    png: true
                    webp: false
                    html: true
                    links: false
                    mhtml: false
                    wacz: false
                  acceptLanguage: ja-JP,ja;q=0.9,en-US;q=0.8,en;q=0.7
              linksOnly:
                summary: Extract links without taking a screenshot
                description: |
                  Skips PNG/WebP/HTML capture and writes only the link list
                  as `{taskId}_..._labels.links.json`. Useful for crawl-driver
                  use cases where only URL discovery is needed.
                value:
                  url: https://www.example.com/
                  labels: [example]
                  captureFormats:
                    png: false
                    webp: false
                    html: false
                    links: true
                    mhtml: false
                    wacz: false
              waczOnly:
                summary: Record the session as a WACZ replayable archive
                description: |
                  Skips every other format and records all HTTP exchanges
                  Chromium performs during the capture (including resources
                  loaded by scroll-triggered lazy loaders) as a single
                  `.wacz` archive. Open the resulting file in
                  [ReplayWeb.page](https://replayweb.page/) for an
                  interactive replay, or embed via the
                  `<replay-web-page>` web component.

                  Out of scope: server-state-dependent dynamic traffic
                  (expiring auth tokens, live WebSocket / SSE streams,
                  WebRTC). The WARC records the original exchange but
                  replay can't reproduce values that change every load.
                value:
                  url: https://www.example.com/
                  labels: [example]
                  captureFormats:
                    png: false
                    webp: false
                    html: false
                    links: false
                    mhtml: false
                    wacz: true
              mhtmlOnly:
                summary: Capture as MHTML single-file archive
                description: |
                  Skips raster screenshot / HTML / link extraction
                  and writes only an MHTML archive as
                  `{taskId}_..._labels.mhtml`. Uses Chromium's
                  `Page.captureSnapshot` CDP method to embed every CSS /
                  image / font / inline script into one MIME multipart
                  file. Open the resulting `.mhtml` directly in Chrome
                  or Edge for an offline-faithful render of the captured
                  page (Firefox / Safari require an extension). Prefer
                  this over the raw `html` format when the captured
                  artifact must render correctly outside the original
                  origin.
                value:
                  url: https://www.example.com/
                  labels: [example]
                  captureFormats:
                    png: false
                    webp: false
                    html: false
                    links: false
                    mhtml: true
                    wacz: false
              dismissBannersInline:
                summary: Page-specific dismissal selectors (inline)
                description: |
                  Adds two custom overlay selectors on top of the curated
                  CMP defaults, drops the noisy `TrustArc` defaults, and
                  lowers the heuristic z-index threshold so a smaller
                  paywall overlay still gets removed. Selectors that fail
                  to parse are skipped silently (best-effort).
                value:
                  url: https://example.com/article
                  labels: [example, paywall]
                  captureFormats:
                    png: true
                    webp: false
                    html: false
                    links: false
                    mhtml: false
                    wacz: false
                  dismissBanners:
                    useDefaults: true
                    extraSelectors:
                      - "#site-paywall"
                      - ".newsletter-takeover"
                    excludeFrameworks: [TrustArc]
                    heuristic:
                      enabled: true
                      minZIndex: 100
              customViewport:
                summary: Capture at a specific viewport
                description: |
                  Overrides the server-side default viewport for this
                  request only — renders at Full HD (`1920 × 1080`)
                  before taking the screenshot. Useful for forcing the
                  desktop variant of a responsive site.
                value:
                  url: https://www.example.com/
                  labels: [example, fhd]
                  captureFormats:
                    png: true
                    webp: false
                    html: false
                    links: false
                    mhtml: false
                    wacz: false
                  viewport:
                    width: 1920
                    height: 1080
              fullPageScreenshot:
                summary: Capture the full document height
                description: |
                  Overrides the server-side default to capture the
                  entire scrollable height of the page (Chromium scrolls
                  and stitches). The viewport stays at the configured
                  default; only the screenshot extent grows.
                value:
                  url: https://www.example.com/
                  labels: [example, full]
                  captureFormats:
                    png: true
                    webp: false
                    html: false
                    links: false
                    mhtml: false
                    wacz: false
                  fullPage: true
              dismissBannersStrict:
                summary: Strict mode (fail capture if dismissal fails)
                description: |
                  Opts out of the default best-effort behaviour with
                  `failOnError: true`. If banner dismissal hits the 5s
                  in-page timeout, if `page.evaluate` rejects, or if any
                  `extraSelectors` entry is invalid CSS, the capture
                  fails (`status: "failed"` / `"timeout"`) and consumes
                  one slot of the retry budget. Use this when a missing
                  banner-dismiss invalidates the captured artifact for
                  your downstream pipeline.
                value:
                  url: https://example.com/article
                  labels: [example, strict]
                  captureFormats:
                    png: true
                    webp: false
                    html: false
                    links: false
                    mhtml: false
                    wacz: false
                  dismissBanners:
                    useDefaults: true
                    extraSelectors:
                      - "#known-paywall"
                    failOnError: true
              keepCookiesAcrossCaptures:
                summary: Preserve cookies between captures (SSO-walled site)
                description: |
                  Skips only the inter-task cookie wipe so the next capture
                  on this worker's persistent tab inherits the cookies set
                  by this one. The `about:blank` navigation still runs, so
                  origin-scoped storage and the JS execution context are
                  still discarded — only browser-scoped cookies survive.
                  Useful for crawling pages behind an SSO login that was
                  captured in a previous request.
                value:
                  url: https://internal.example.com/dashboard
                  labels: [sso, dashboard]
                  captureFormats:
                    png: true
                    webp: false
                    html: false
                    links: false
                    mhtml: false
                    wacz: false
                  resetState:
                    cookies: false
              noResetAtAll:
                summary: Stateful crawl — keep everything between captures
                description: |
                  Disables both axes of the inter-task wipe. Cookies, DOM
                  context, in-flight timers, and origin-scoped storage all
                  carry over to the next task on this worker. The
                  `boolean` short form `false` is equivalent to the object
                  form `{ cookies: false, pageContext: false }`. Use this
                  for multi-page journeys against a single origin where
                  state continuity is the point of the capture.
                value:
                  url: https://example.com/step-2
                  labels: [journey, step2]
                  captureFormats:
                    png: true
                    webp: false
                    html: false
                    links: false
                    mhtml: false
                    wacz: false
                  resetState: false
              cookiesOnlyReset:
                summary: Wipe cookies only, keep DOM context
                description: |
                  Clears browser-scoped cookies between captures but skips
                  the `about:blank` navigation, so DOM listeners / timers
                  and origin-scoped storage carry over. Less commonly
                  useful than the inverse (preserving cookies); included
                  here mainly for symmetry. Note that with `pageContext:
                  false`, the next task's `page.goto` is what eventually
                  tears down the previous document — until then, the
                  inter-task gap has the previous task's residue.
                value:
                  url: https://example.com/page
                  labels: [example]
                  captureFormats:
                    png: true
                    webp: false
                    html: false
                    links: false
                    mhtml: false
                    wacz: false
                  resetState:
                    cookies: true
                    pageContext: false
      responses:
        "202":
          description: Request accepted for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureAcceptance"
        "400":
          description: Validation failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: URL already in queue (when rejectDuplicateUrls is enabled)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: No operational workers available
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/captures/{taskId}:
    get:
      operationId: getCapture
      summary: Get the result of a submitted capture
      description: |
        Report what became of a single task, by the `taskId` returned from
        `POST /v1/captures`.

        Unlike `/v1/status` — which is a snapshot of the queue and says
        nothing about tasks that already left it — this answers per task and
        distinguishes the three states a client needs:

        | Response | Meaning |
        |----------|---------|
        | `200` | The task finished. `status` says whether it produced artifacts. |
        | `202` | Still queued or in flight. Poll again. |
        | `404` | Unknown task, **or** its result aged out of the cache. |

        The cache is bounded (`--result-cache-size`, default 1000, oldest
        evicted first) and does not survive a restart. The durable record is
        the `.result.json` manifest written next to the artifacts in the
        configured bucket; it carries the same body as the `200` response
        here. A client that must not miss results should read the manifest
        rather than rely on this endpoint.
      parameters:
        - name: taskId
          in: path
          required: true
          description: The `taskId` returned by `POST /v1/captures`.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The task finished and its result is still cached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureResultReport"
        "202":
          description: |
            The task is still pending or being processed. The body is empty —
            there is nothing to report yet.
        "404":
          description: |
            No such task, or the result was evicted from the bounded cache.
            These are deliberately not distinguished: the server no longer
            holds the information needed to tell them apart.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/status:
    get:
      operationId: getStatus
      summary: Get capture coordinator status
      description: |
        Returns the current status of the queue and worker pool, including a
        snapshot of pending tasks (head of the queue, capped by
        `pendingLimit`).
      parameters:
        - name: pendingLimit
          in: query
          required: false
          description: |
            Maximum number of pending tasks to include in
            `queue.pendingTasks`. Defaults to 50; clamp at 200 to bound the
            response size.
          schema:
            type: integer
            minimum: 0
            maximum: 200
            default: 50
      responses:
        "200":
          description: Current status of queue and workers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "400":
          description: Invalid query parameter
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  schemas:
    CaptureFormats:
      type: object
      description: Capture format flags. At least one must be true.
      required: [png, webp, html, links, mhtml, wacz]
      additionalProperties: false
      properties:
        png:
          type: boolean
        webp:
          type: boolean
          description: |
            Capture a WebP screenshot via Chromium's
            `Page.captureScreenshot { format: "webp" }`. Set
            `--screenshot-quality` (or `BROWSERHIVE_SCREENSHOT_QUALITY`)
            to control the lossy quality (1–100); when omitted,
            Chromium's default is used. Uploaded as
            `{taskId}_..._labels.webp`.
        html:
          type: boolean
        links:
          type: boolean
          description: |
            Extract `<a href>` links from the rendered page and upload the
            list as `{taskId}_..._labels.links.json` to the configured
            S3 bucket (same naming pattern as the other capture formats).
            Useful as the discovery side of an external crawl driver.
        mhtml:
          type: boolean
          description: |
            Capture the rendered page as MHTML (MIME multipart archive)
            via Chromium's CDP `Page.captureSnapshot` and upload it as
            `{taskId}_..._labels.mhtml` to the configured S3 bucket (same
            naming pattern as the other capture formats). All resources —
            CSS, images, fonts, inline scripts — are embedded in a single
            file, so the captured page renders identically when opened
            offline (no broken relative URLs, unlike the raw `html`
            format). Chrome / Edge open `.mhtml` files directly; Firefox /
            Safari require an extension.
        wacz:
          type: boolean
          description: |
            Record every HTTP exchange Chromium performs during the capture
            into a [WACZ](https://specs.webrecorder.net/wacz/1.0.0/) archive
            and upload it as `{taskId}_..._labels.wacz` (a ZIP file) to the
            configured S3 bucket. Replay with
            [ReplayWeb.page](https://replayweb.page/) — drag-and-drop the
            file or load via the `<replay-web-page>` web component.

            Captures resources fetched throughout the entire session,
            including those triggered by future scroll-driven lazy loaders.
            Cookie / `Set-Cookie` / `Authorization` headers are recorded in
            full so static replay matches the original exchange.

            **Out of scope:** server-state-dependent dynamic traffic. The
            WARC records the exchange faithfully but replay cannot
            reproduce values that change every load — expiring auth tokens
            (JWT / OAuth), per-request CSRF tokens, live WebSocket / SSE
            streams, WebRTC.
    CaptureRequest:
      type: object
      required: [url, captureFormats]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          minLength: 1
          description: Target URL to capture
        labels:
          type: array
          items:
            type: string
          default: []
          description: Display labels (used for filename)
        correlationId:
          type: string
          description: Correlation ID provided by the client for tracking
        captureFormats:
          $ref: "#/components/schemas/CaptureFormats"
        acceptLanguage:
          type: string
          minLength: 1
          maxLength: 200
          # Printable ASCII only — disallows CR / LF / NUL and other control
          # characters so a malicious value cannot inject additional HTTP
          # headers when forwarded via Network.setExtraHTTPHeaders.
          pattern: "^[\\x20-\\x7e]+$"
          description: |
            Value to send as the upstream `Accept-Language` header for this
            capture only. Useful for sites whose content varies by language
            (locale-redirecting corporate top pages, search engines,
            Wikipedia, etc.).

            Format follows IETF BCP 47 quality-list syntax, e.g.
            `ja-JP,ja;q=0.9,en-US;q=0.8,en;q=0.7`.

            When omitted, no `Accept-Language` header is set explicitly and
            the upstream Chromium uses its built-in default (controlled by
            its `--lang` startup flag / OS locale).
        signing:
          type: boolean
          default: false
          description: |
            Ask the configured signing service for a wacz-auth signature and
            store it as `datapackage-digest.json` inside the WACZ.

            Requires `captureFormats.wacz: true` — asking to sign a capture
            that produces no WACZ is rejected with 400, because there would be
            nowhere to put the signature.

            A capture whose signature fails still succeeds. The WACZ is written
            without one and the outcome is reported in the result's `signature`
            field, so an unsigned archive is never silently indistinguishable
            from a signed one.

            Not part of `captureFormats`: a signature is a property of the WACZ,
            not a separate artefact, and every field in `captureFormats` is
            required of every client.
        dismissBanners:
          oneOf:
            - type: boolean
            - $ref: "#/components/schemas/DismissSpec"
          description: |
            Run banner / modal dismissal before capturing. Removes known
            consent-management-platform overlays and large fixed/sticky
            overlays via heuristic.

            Two shapes are accepted:

            - `boolean` — `false` (or omitted) skips dismissal entirely;
              `true` is equivalent to `{ "useDefaults": true }` (the curated
              CMP list plus the default heuristic).
            - `DismissSpec` — inline customization. Use `extraSelectors` to
              add page-specific overlay selectors, `excludeFrameworks` to
              suppress a noisy default, or `heuristic.enabled: false` to
              disable the size/z-index fallback.

            When enabled, the server log line for the completed task
            includes a `dismissReport`:

            ```json
            {
              "msg": "Task completed",
              "url": "https://www.theguardian.com",
              "dismissReport": {
                "framework": "Sourcepoint",
                "removedSelectors": ["[id^=\"sp_message_container\"]"],
                "removedOverlayCount": 1
              }
            }
            ```

            - `framework` — matched CMP name, `"custom"` when only an
              `extraSelectors` entry fired, `"heuristic"` when only the
              fallback fired, or `null` when nothing matched.
            - `removedSelectors` — exact CSS selectors whose elements were
              removed in the CMP-selector pass (includes both default-CMP
              and custom `extraSelectors` matches).
            - `removedOverlayCount` — number of elements removed by the
              heuristic pass (fixed/sticky elements with high `z-index`
              covering ≥`minViewportCoverageRatio` of the viewport,
              excluding semantic landmarks).

            By default best-effort: dismissal failures (in-page evaluate
            timeout, the `page.evaluate` promise rejecting, or an invalid
            CSS selector in `extraSelectors` raising `SyntaxError`) are
            swallowed and the offending entry is skipped, so a malformed
            page or a typo cannot fail the capture.

            Set `dismissBanners.failOnError: true` to opt out — failures
            then fail the entire capture (`status: "failed"` or
            `"timeout"` in the worker log) and `dismissReport` is **not**
            present on the result; inspect `errorDetails` instead. The
            failure is treated like any other capture failure for retry
            accounting (consumes one slot of `--max-retry-count`).
        viewport:
          type: object
          required: [width, height]
          additionalProperties: false
          properties:
            width:
              type: integer
              minimum: 1
              maximum: 7680
            height:
              type: integer
              minimum: 1
              maximum: 4320
          description: |
            Per-request browser viewport in CSS pixels. When provided,
            `page.setViewport` is called with these dimensions before
            navigating to the target URL — useful for sites whose layout
            varies by viewport size (responsive top pages, mobile-only
            content) or for capturing at a specific resolution.

            When omitted, the server-side default applies (configured via
            `--viewport-width` / `--viewport-height` /
            `BROWSERHIVE_VIEWPORT_*`; the built-in default is
            `1280 × 800`).

            Bounds (`1–7680 × 1–4320`) cover up to 8K rendering and exist
            only as a sanity guard against runaway memory use in
            Chromium — typical values are `1280 × 800` (desktop default),
            `1920 × 1080` (Full HD), or `375 × 667` (iPhone SE).
        operationDelayMs:
          type: integer
          minimum: 0
          maximum: 10000
          description: |
            Delay (ms) inserted before each browser operation for this capture,
            so a headless run can be watched live over the DevTools screencast
            (`chrome://inspect`). The browser connection is not re-made, so no
            other request is affected.

            Not puppeteer's `slowMo`: that is fixed at connect time and also
            paces puppeteer's own internal CDP commands, whereas this paces only
            the operations the server issues, per request. The behaviour differs,
            so the name does too.

            When omitted, the server-side default applies (configured via
            `--operation-delay-ms` / `BROWSERHIVE_OPERATION_DELAY_MS`; the
            built-in default is `0`, i.e. no delay).

            The ceiling comes from the task budget and nothing else. A capture
            issues roughly a dozen paced operations, so about 10s apiece is what
            still fits inside `--task-timeout` (130s by default); past that the
            task is failed for taking too long, which is correct. The
            per-operation budgets do not charge for this delay at all — they
            bound the operation, not the pause in front of it.
        trace:
          type: boolean
          description: |
            Log what BrowserHive did to the **captured page's** console for this
            capture, so a run can be read in `chrome://inspect` next to the live
            screencast. Every line is prefixed `[bh]`; filter the DevTools
            console on that to separate them from the page's own output, and
            turn on `Preserve log` so a client-side redirect does not clear them.

            Three groups are emitted:

            - `[bh] interventions` — what was done *to* the page: viewport and
              device pixel ratio, User-Agent and Accept-Language overrides,
              hidden scrollbars, and any banners removed.
            - `[bh] decisions` — what the behaviors *chose*: whether
              `autoscroll` reached the bottom or ran out of steps, and how many
              of `autofetch`'s candidates the browser would never have
              requested on its own.
            - `[bh] archive` — which responses did **not** reach the archive,
              and why: blocked by pattern, body omitted (content-type / too
              large / task cap), or bodyless (seen only as `304`). Emitted only
              when `wacz` was requested, since there is no recorder otherwise.

            Deliberately excludes timings: the Network and Performance panels
            already show those. What is here is what DevTools cannot know.

            Pairs well with `operationDelayMs`, which slows the run down enough
            to watch. Off by default; the server-wide default is set with
            `--capture-trace` / `BROWSERHIVE_CAPTURE_TRACE`. Writes to the page
            only — artifacts and the `behaviorReport` are unaffected.
        cache:
          type: string
          enum: [default, bypass, clear]
          description: |
            How this capture treats the browser's HTTP cache. Omitted → the
            server default (`--cache` / `BROWSERHIVE_CACHE`), which ships as
            `clear`.

            - `default` — use it. A URL captured before can come back
              `304 Not Modified`, which carries no body: there is nothing to
              archive and the capture fails with `status: httpError`.
            - `bypass` — do not read the cache for this capture. Entries left
              by earlier captures stay where they are.
            - `clear` — empty the whole cache first, then capture without
              reading it. Nothing an earlier capture stored can influence this
              one.

            Neither `bypass` nor `clear` stops this capture from *filling* the
            cache: Chromium keeps storing responses while cache reads are
            disabled. So a `default` capture of the same URL afterwards can
            still see a `304` in both cases — which is why the default is to
            clear on every capture rather than once.

            Ships as `clear` because this is an archiver: an archive assembled
            from cache hits is not an archive.

            `archiveMode: multipass` never reads the cache regardless of this
            setting — a later pass served from what an earlier pass stored
            would defeat the sweep.
        archiveMode:
          type: string
          enum: [single-pass, multipass]
          description: |
            How many passes the capture makes over the page.

            - `single-pass` (default) — load the page once, at the configured
              device pixel ratio, with the browser cache in play.
            - `multipass` — load the same page once per device pixel ratio
              (1 and 2) into a **single WACZ**, so replay is correct on both
              normal and Retina displays. Each pass is fetched with the
              **browser cache disabled**: a pass served from cache would defeat
              the point, and a revalidated `304` carries no body, which would
              leave holes in the archive.

            `multipass` roughly doubles capture time and archive size, and
            `deviceScaleFactor` is ignored (the mode sweeps its own DPR set).
            PNG / WebP screenshots come from the last pass, i.e. at DPR 2.

            Worth it for sites that *compute* image URLs from
            `devicePixelRatio` (the variant for the DPR you did not capture at
            appears nowhere in the DOM). Sites that declare every candidate in
            `srcset` are already covered at any single DPR by the `autofetch`
            behavior.

            When omitted, the server-side default applies (configured via
            `--archive-mode` / `BROWSERHIVE_ARCHIVE_MODE`; the built-in default
            is `single-pass`).
        deviceScaleFactor:
          type: integer
          minimum: 1
          maximum: 3
          description: |
            Device pixel ratio (`window.devicePixelRatio`) the capture browser
            renders at. `1` is a normal display; `2` is Retina.
            Ignored when `archiveMode` is `multipass`.

            Set to `2` to capture a **Retina-faithful WACZ**: the page then
            requests the `2x` responsive-image candidates. This is the fix for
            JS carousels (e.g. apple.com TV+) whose slides carry no `srcset` and
            derive their image URL from the DPR — at DPR 1 the `2x` variant is
            never referenced, so it cannot be archived; a Retina replay then
            shows black slides. Note that DPR 2 also doubles the pixel
            dimensions (and size) of any PNG / WebP screenshot.

            When omitted, the server-side default applies (configured via
            `--device-scale-factor` / `BROWSERHIVE_DEVICE_SCALE_FACTOR`; the
            built-in default is `1`).
        fullPage:
          type: boolean
          description: |
            When `true`, the PNG / WebP screenshot extends below the
            viewport to capture the full document height (Chromium scrolls
            and stitches the result). When `false` or omitted, only the
            viewport-sized region is captured.

            When omitted, the server-side default applies (configured via
            `--screenshot-full-page` / `BROWSERHIVE_SCREENSHOT_FULL_PAGE`;
            the built-in default is `false`).

            Has no effect on the `html` / `links` formats.
        behaviors:
          type: object
          additionalProperties: false
          description: |
            Per-request behavior override. Behaviors are scripts injected into
            the page during capture that automate interaction so dynamic
            resources are archived — the built-in `autoscroll` (scrolls the
            full height so `loading="lazy"` / IntersectionObserver / `data-src`
            loaders fire), `autofetch` (actively fetches every `srcset` /
            `data-*` candidate so replay is DPR/viewport-complete, e.g. Retina
            `_2x` variants), and `autoplay` (muted-plays and fetches
            `<video>` / `<audio>` media — opt-in, off by default, can be
            large), plus optional client-supplied custom behaviors.

            When omitted, the server default set applies (configured via
            `--behaviors` / `BROWSERHIVE_BEHAVIORS`; the built-in default is
            `autoscroll,autofetch`). The whole pass is bounded by
            `--behavior-timeout` so it cannot hang the worker.

            When at least one behavior runs, the server log line for the
            completed task includes a `behaviorReport`:

            ```json
            {
              "msg": "Task completed",
              "url": "https://www.apple.com/",
              "behaviorReport": {
                "ran": [
                  { "id": "autoscroll", "steps": 12, "ms": 3400 },
                  { "id": "autofetch", "steps": 9, "ms": 1800 }
                ],
                "timedOut": false
              }
            }
            ```

            - `ran` — each behavior that actually ran (enabled ∩ `isMatch`),
              in execution order, with its `steps` (yield checkpoints), wall
              `ms`, and an `error` string if it threw.
            - `timedOut` — `true` if the pass hit `--behavior-timeout` and
              remaining behaviors were skipped.
          properties:
            builtins:
              type: array
              items:
                type: string
              description: |
                Built-in behavior ids to run, in execution order. Replaces the
                server default enabled set for this capture. An empty array
                disables all built-ins.
            options:
              type: object
              additionalProperties: true
              description: |
                Per-behavior option overrides, keyed by behavior id, merged over
                the server options — e.g. `{ "autoscroll": { "maxSteps": 60 } }`.
            siteBehaviors:
              type: boolean
              description: |
                Whether the site-specific behaviors bundled into the server's
                runtime are considered for this capture. They only act on the
                hosts their own `isMatch()` accepts, so leaving this alone is
                normally right; set `false` to capture with the built-ins (and
                any client `custom` behaviors) only — useful when comparing runs
                or reproducing an older archive.

                When omitted, the server-side default applies (configured via
                `--no-site-behaviors` / `BROWSERHIVE_SITE_BEHAVIORS`; the
                built-in default is on). Behaviors that run are listed in the
                completed-task log's `behaviorReport`, where bundled ones carry a
                `site:` id prefix.
            custom:
              type: array
              description: |
                Client-supplied custom behaviors. Honoured only when the server
                is started with `--allow-custom-behaviors`; otherwise ignored.
              items:
                type: object
                additionalProperties: false
                required: [id, source]
                properties:
                  id:
                    type: string
                    description: Identifier used in the behavior report.
                  source:
                    type: string
                    description: |
                      A JavaScript class *expression* implementing the behavior
                      interface: `class { static id = "…"; static isMatch() {…}
                      async *run(ctx) {…} }`. Injected into the page and
                      registered alongside the built-ins.
        resetState:
          oneOf:
            - type: boolean
            - $ref: "#/components/schemas/ResetStateSpec"
          description: |
            Per-request control of the inter-task wipe applied to the
            worker's persistent Chromium tab AFTER this capture completes.
            BrowserHive holds one tab per worker for its entire lifetime,
            so without a wipe, cookies / DOM listeners / origin-scoped
            storage from this capture would bleed into whatever task this
            worker processes next.

            Two shapes are accepted:

            - `boolean` — `true` forces a full wipe (both axes), `false`
              skips the wipe entirely (stateful carry-over). Both ignore
              server-side defaults.
            - `ResetStateSpec` — per-axis override; omitted fields fall
              back to the server-side default
              (`--no-reset-cookies` / `--no-reset-page-context` /
              `BROWSERHIVE_RESET_COOKIES` / `BROWSERHIVE_RESET_PAGE_CONTEXT`).

            When omitted, the server-side default applies (built-in
            default: both axes wipe, matching the long-standing behaviour
            of clearing state between captures).

            See `ResetStateSpec` for the per-axis semantics and the
            "two axes, not three" rationale (origin-scoped storage is
            inseparable from `pageContext`).
    DismissHeuristicSpec:
      type: object
      additionalProperties: false
      description: |
        Heuristic-pass thresholds for the second dismissal pass (the
        size / z-index fallback that removes large fixed/sticky overlays
        that don't match a known CMP selector). All fields are optional;
        omitted fields fall back to server-side defaults
        (`enabled: true`, `minViewportCoverageRatio: 0.3`,
        `minZIndex: 1000`).
      properties:
        enabled:
          type: boolean
          description: |
            When `false`, the heuristic pass is skipped entirely. Useful
            when the curated CMP selectors are sufficient and the
            heuristic is producing false positives on a particular page.
        minViewportCoverageRatio:
          type: number
          minimum: 0
          maximum: 1
          description: |
            Minimum fraction of the viewport an overlay must cover to
            be removed (`width × height / (innerWidth × innerHeight)`).
            Lower values are more aggressive.
        minZIndex:
          type: integer
          minimum: 0
          description: |
            Minimum computed `z-index` an element must have to qualify
            as an overlay candidate. Lower values are more aggressive.
    ResetStateSpec:
      type: object
      additionalProperties: false
      description: |
        Per-axis control of the inter-task wipe. Each field omitted falls
        back to the server-side default (`CaptureConfig.resetPageState`,
        configurable via `--no-reset-cookies` / `--no-reset-page-context`
        and the matching `BROWSERHIVE_RESET_*` env vars; the built-in
        default is both axes true).

        Two axes (not three): `localStorage` / `sessionStorage` /
        `IndexedDB` are origin-scoped, so navigating to `about:blank`
        already disposes them. Exposing a separate "storage" knob would
        either duplicate `pageContext` or describe a state the API cannot
        actually deliver, so the two are coupled under one knob.
      properties:
        cookies:
          type: boolean
          description: |
            When `true`, browser-scoped cookies are cleared via CDP
            `Network.clearBrowserCookies` after each capture. When
            `false`, cookies set during this capture survive into the
            next task on this worker — useful for keeping an SSO session
            alive across multiple captures. Independent of `pageContext`
            (cookies live on the browser, not the page).
        pageContext:
          type: boolean
          description: |
            When `true`, the worker navigates to `about:blank` after each
            capture, which tears down the JS execution context (closures,
            timers, listeners) and disposes origin-scoped storage
            (`localStorage` / `sessionStorage` / `IndexedDB`) as a
            side-effect. When `false`, all of those carry over until the
            next `page.goto` supersedes the previous document.
    DismissSpec:
      type: object
      additionalProperties: false
      description: |
        Inline customization of banner / modal dismissal for a single
        capture. All fields are optional; omitted fields fall back to
        server-side defaults equivalent to `dismissBanners: true`.

        `extraSelectors` matches are reported in `dismissReport` as
        `framework: "custom"`. By default, selectors that fail to parse
        (`querySelector` SyntaxError) are skipped silently so a typo in
        one entry cannot block the rest — set `failOnError: true` to opt
        into strict propagation.
      properties:
        useDefaults:
          type: boolean
          description: |
            When `true` (default), the curated `KNOWN_CMP_ENTRIES` list
            (OneTrust, Cookiebot, Sourcepoint, …) is included. When
            `false`, only `extraSelectors` is used in pass 1.
        extraSelectors:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 200
            # Printable ASCII only — disallows CR / LF / NUL and other
            # control characters. CSS selector character class is far
            # narrower; this is the safety floor.
            pattern: "^[\\x20-\\x7e]+$"
          description: |
            Additional CSS selectors to remove in pass 1, on top of the
            (optional) defaults selected by `useDefaults`. Each successful
            removal is reported in `dismissReport.removedSelectors` and
            attributed to `framework: "custom"`.
        excludeFrameworks:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 100
          description: |
            Names of default CMP frameworks to suppress when
            `useDefaults: true`. Use this to silence a default that is
            producing false positives on a specific page (e.g.
            `["TrustArc"]`). Names must match the `framework` field of
            an entry in `KNOWN_CMP_ENTRIES`.
        heuristic:
          $ref: "#/components/schemas/DismissHeuristicSpec"
        failOnError:
          type: boolean
          description: |
            When `true`, a dismissal failure (in-page evaluate timeout,
            the `page.evaluate` promise rejecting, or a `querySelector`
            SyntaxError raised by an entry in `extraSelectors`) fails
            the entire capture (`status: "failed"` or `"timeout"`)
            instead of being swallowed into an empty `dismissReport`.

            Default `false` — preserves the long-standing best-effort
            contract where a malformed page or a typo in a custom
            selector cannot fail the capture. Strict mode failures are
            classified by the existing error pipeline (timeout vs
            internal vs connection) and consume one slot of the worker's
            retry budget like any other capture failure.
    CaptureAcceptance:
      type: object
      required: [accepted, taskId]
      additionalProperties: false
      properties:
        accepted:
          type: boolean
          description: Always true on 202 (errors return 4xx/5xx with Problem body)
        taskId:
          type: string
          format: uuid
          description: Server-generated task ID
        correlationId:
          type: string
          description: Correlation ID echoed from the request, when provided
    CaptureStatus:
      type: string
      description: |
        Outcome of a finished capture. Only `success` means artifacts were
        produced and uploaded.
      enum: [success, failed, timeout, httpError]
    CaptureArtifacts:
      type: object
      description: |
        External location of each artifact the task produced, keyed by
        format. A key is absent when that format was not requested or the
        capture failed before producing it. Values are whatever the
        configured artifact store returns — `s3://<bucket>/<key>` for
        S3-compatible storage.
      additionalProperties: false
      properties:
        png:
          type: string
        webp:
          type: string
        html:
          type: string
        links:
          type: string
        mhtml:
          type: string
        wacz:
          type: string
    WaczStats:
      type: object
      description: |
        NetworkRecorder tallies for the WACZ recording. Present only when
        `wacz` was requested and the recording finished.
      required:
        - totalRecorded
        - totalBlocked
        - totalSkippedContentType
        - totalTruncatedTooLarge
        - totalTruncatedTaskCap
        - totalFailed
        - totalIncomplete
        - totalBodyBytes
      additionalProperties: false
      properties:
        totalRecorded:
          type: integer
        totalBlocked:
          type: integer
        totalSkippedContentType:
          type: integer
        totalTruncatedTooLarge:
          type: integer
        totalTruncatedTaskCap:
          type: integer
        totalFailed:
          type: integer
        totalIncomplete:
          type: integer
        totalBodyBytes:
          type: integer
    WaczSignature:
      type: object
      description: |
        What became of the wacz-auth signature. Present only when the capture
        asked to be signed — its absence means nobody requested one, which is a
        different statement from `signed: false`.
      required: [signed]
      additionalProperties: false
      properties:
        signed:
          type: boolean
          description: |
            Whether `datapackage-digest.json` was written into the WACZ.

            `false` is not a failed capture. A signature is optional, so a
            signing service that is down, slow, or refusing a token leaves an
            archive that is still worth keeping.
        reason:
          type: string
          description: Why there is no signature. Set when `signed` is false.
        domain:
          type: string
          description: The domain the signing certificate is issued for. Set when `signed` is true.

    WaczCompleteness:
      type: object
      description: |
        Whether the archive actually holds the bytes a replay will ask for.
        `complete: false` means at least one body is missing, for one of two
        reasons kept in separate lists: `bodylessUrls` (the URL was only ever
        seen as a `304`, so no body reached the recorder) and `truncatedUrls`
        (the body arrived but was dropped for exceeding a size cap — raising
        `--wacz-max-response-bytes` or `--wacz-max-task-bytes` would keep it).
        Bodies omitted by the content-type filter are not counted: that filter
        is the caller's own configuration.
      required: [bodylessUrls, truncatedUrls, complete]
      additionalProperties: false
      properties:
        bodylessUrls:
          type: array
          items:
            type: string
        truncatedUrls:
          type: array
          items:
            type: string
        complete:
          type: boolean
    CaptureErrorDetails:
      type: object
      description: Why a capture did not succeed. Absent on success.
      required: [type, message]
      additionalProperties: false
      properties:
        type:
          $ref: "#/components/schemas/ErrorType"
        message:
          type: string
        httpStatusCode:
          type: integer
        httpStatusText:
          type: string
        timeoutMs:
          type: integer
    CaptureResultReport:
      type: object
      description: |
        What became of one capture task. Returned by
        `GET /v1/captures/{taskId}` and written verbatim as the
        `.result.json` manifest next to the artifacts, so a consumer can
        parse either source with the same code.
      required:
        - taskId
        - url
        - labels
        - status
        - timestamp
        - captureProcessingTimeMs
        - retryCount
        - workerIndex
        - artifacts
      additionalProperties: false
      properties:
        taskId:
          type: string
          format: uuid
        correlationId:
          type: string
          description: Echoed from the request, when one was provided.
        url:
          type: string
        labels:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/CaptureStatus"
        httpStatusCode:
          type: integer
          description: HTTP status of the captured page's main response.
        timestamp:
          type: string
          format: date-time
        captureProcessingTimeMs:
          type: integer
        retryCount:
          type: integer
          description: How many retries the task had consumed when it finished.
        workerIndex:
          type: integer
        artifacts:
          $ref: "#/components/schemas/CaptureArtifacts"
        waczStats:
          $ref: "#/components/schemas/WaczStats"
        completeness:
          $ref: "#/components/schemas/WaczCompleteness"
        signature:
          $ref: "#/components/schemas/WaczSignature"
        errorDetails:
          $ref: "#/components/schemas/CaptureErrorDetails"
    Problem:
      type: object
      description: RFC 7807 Problem Details
      required: [title, status]
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    WorkerHealth:
      type: string
      enum: [ready, busy, error, disconnected]
    ErrorType:
      type: string
      enum: [http, timeout, connection, internal]
    ErrorTaskInfo:
      type: object
      required: [taskId, url, labels]
      additionalProperties: false
      properties:
        taskId:
          type: string
        url:
          type: string
        labels:
          type: array
          items:
            type: string
    ErrorRecord:
      type: object
      required: [type, message, timestamp]
      additionalProperties: false
      properties:
        type:
          $ref: "#/components/schemas/ErrorType"
        message:
          type: string
        httpStatusCode:
          type: integer
        httpStatusText:
          type: string
        timeoutMs:
          type: integer
        timestamp:
          type: string
          format: date-time
        task:
          $ref: "#/components/schemas/ErrorTaskInfo"
    BrowserOptions:
      type: object
      required: [browserUrl]
      additionalProperties: false
      properties:
        browserUrl:
          type: string
          description: >-
            The configured browser endpoint, returned in WHATWG-canonical form
            (e.g. a trailing slash is added: `http://chromium-1:9222/`). The
            server parses the operator-supplied value into a URL, so the string
            echoed here is the normalized form, not necessarily the exact input.
          example: http://chromium-1:9222/
    CurrentTask:
      type: object
      description: |
        Snapshot of the task a worker is currently processing. Present only
        when the worker is in the `busy` health state. `elapsedMs` is
        computed at response-build time as `now - startedAt`.
      required: [taskId, url, labels, startedAt, elapsedMs, retryCount]
      additionalProperties: false
      properties:
        taskId:
          type: string
        url:
          type: string
        labels:
          type: array
          items:
            type: string
        correlationId:
          type: string
        startedAt:
          type: string
          format: date-time
        elapsedMs:
          type: integer
        retryCount:
          type: integer
    WorkerInfo:
      type: object
      required:
        - index
        - browserOptions
        - health
        - processedCount
        - errorCount
        - errorHistory
      additionalProperties: false
      properties:
        index:
          type: integer
        browserOptions:
          $ref: "#/components/schemas/BrowserOptions"
        health:
          $ref: "#/components/schemas/WorkerHealth"
        processedCount:
          type: integer
        errorCount:
          type: integer
        errorHistory:
          type: array
          items:
            $ref: "#/components/schemas/ErrorRecord"
        currentTask:
          $ref: "#/components/schemas/CurrentTask"
    PendingTask:
      type: object
      description: |
        Snapshot of a task waiting in the queue. `queuedMs` is computed at
        response-build time as `now - enqueuedAt` and is preserved across
        retries (so a task stuck in retry loops shows its true total age).
      required: [taskId, url, labels, enqueuedAt, queuedMs, retryCount]
      additionalProperties: false
      properties:
        taskId:
          type: string
        url:
          type: string
        labels:
          type: array
          items:
            type: string
        correlationId:
          type: string
        enqueuedAt:
          type: string
          format: date-time
        queuedMs:
          type: integer
        retryCount:
          type: integer
    ProcessingTask:
      type: object
      description: |
        Snapshot of a task currently being processed by a worker. Mirrors
        `PendingTask` but adds `workerIndex`, `startedAt`, and
        `elapsedMs` so callers can correlate the processing task with the
        owning worker and see how long it has been running.
      required:
        - taskId
        - url
        - labels
        - enqueuedAt
        - queuedMs
        - retryCount
        - workerIndex
        - startedAt
        - elapsedMs
      additionalProperties: false
      properties:
        taskId:
          type: string
        url:
          type: string
        labels:
          type: array
          items:
            type: string
        correlationId:
          type: string
        enqueuedAt:
          type: string
          format: date-time
        queuedMs:
          type: integer
        retryCount:
          type: integer
        workerIndex:
          type: integer
        startedAt:
          type: string
          format: date-time
        elapsedMs:
          type: integer
    QueueSnapshot:
      type: object
      description: |
        Container for runtime queue introspection. `pendingTasks` is the
        head of the pending queue; `processingTasks` is the set of tasks
        currently held by busy workers (one per busy worker).
      required: [pendingTasks, processingTasks]
      additionalProperties: false
      properties:
        pendingTasks:
          type: array
          items:
            $ref: "#/components/schemas/PendingTask"
        processingTasks:
          type: array
          items:
            $ref: "#/components/schemas/ProcessingTask"
    StatusResponse:
      type: object
      required:
        - pending
        - processing
        - succeeded
        - failed
        - operationalWorkers
        - totalWorkers
        - isRunning
        - isDegraded
        - workers
        - queue
        - build
      additionalProperties: false
      properties:
        pending:
          type: integer
        processing:
          type: integer
        succeeded:
          type: integer
          description: |
            Tasks that finished with a capture and uploaded artifacts.
        failed:
          type: integer
          description: |
            Tasks the server gave up on after exhausting the retry budget.
            Counted separately from `succeeded` because the two are not
            interchangeable: a client reconciling its own records needs to
            know which tasks will never produce an artifact.
        operationalWorkers:
          type: integer
        totalWorkers:
          type: integer
        isRunning:
          type: boolean
        isDegraded:
          type: boolean
        workers:
          type: array
          items:
            $ref: "#/components/schemas/WorkerInfo"
        queue:
          $ref: "#/components/schemas/QueueSnapshot"
        build:
          type: object
          additionalProperties: false
          required: [version, revision, buildTime]
          description: |
            Build fingerprint baked in at build time (src/generated/version.ts).
            Use `revision` to confirm the running server matches a given source:
            `revision === $(git rev-parse --short HEAD)`.
          properties:
            version:
              type: string
              description: BrowserHive package version (package.json).
            revision:
              type: string
              description: |
                Short git commit the image was built from — passed at build time
                via `GIT_REV` (Docker) or read from git (host). `"dev"` when
                neither was available.
            buildTime:
              type: string
              format: date-time
              description: When this build was produced. Changes every build.
