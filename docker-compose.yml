# waggle stack on Apple Container, driven by container-compose
# (https://github.com/Mcrich23/Container-Compose — installed via Homebrew).
#
#   container-compose up -d -b     # build and start everything
#   container-compose down         # stop; volumes (and their data) survive
#
# One-time machine setup:
#   sudo container system dns create waggle
# The project-named DNS domain switches container-compose into its real-DNS
# mode: containers are named <service>.waggle, registered with the platform
# DNS, and resolvable from other containers AND from the host — which is what
# lets waggle itself run on the host against this stack.
# Do NOT add container_name: keys — they suppress the DNS naming and drop the
# stack back to /etc/hosts patching, which silently fails for the non-root
# containers here (browserhive, chromium).
#
# Readiness is deliberately NOT handled here (container-compose has no
# healthcheck support, and depends_on is start order only): the S3 bucket init
# runs inside seaweedfs's entrypoint, browserhive waits on WAIT_FOR_S3, and
# humans use the curl wait loop in the docs.
#
# Upstream source comes from the .upstream/browserhive submodule, not from a
# git URL — `container build` only accepts a context directory. The submodule
# carries browserhive, its chromium-server-docker (at the version browserhive
# was tested against), and the SeaweedFS config, so there is exactly one
# upstream pin: the submodule pointer.

# Pin the project name. container-compose derives it from the directory name
# otherwise, and the project name IS the DNS domain here: it must equal the
# `container system dns create <name>` domain and the `<service>.waggle`
# hostnames below.
name: waggle

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      - POSTGRES_USER=waggle
      - POSTGRES_PASSWORD=waggle
      - POSTGRES_DB=waggle
      # A named volume here is a formatted filesystem, so its mount point
      # already contains lost+found and initdb refuses to use it
      # ("directory exists but is not empty"). Put the cluster in a
      # subdirectory of the mount, which is what the image documents for this
      # case.
      - PGDATA=/var/lib/postgresql/data/pgdata
    # Published so host tooling (psql, and waggle itself) can reach it either
    # by name (postgres.waggle) or on localhost.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # OpenFGA's own store, deliberately NOT the `postgres` service above.
  #
  # Sharing one instance would invite the assumption that a tuple can be
  # written inside waggle's application transaction — it cannot: OpenFGA is
  # written through its HTTP API, never through SQL, so no transaction spans
  # both. Keeping the databases apart makes that boundary visible, which is
  # exactly why the fga_outbox table exists. (OpenFGA's own docs also want a
  # dedicated database.)
  openfga-db:
    image: docker.io/library/postgres:17-alpine
    environment:
      - POSTGRES_USER=openfga
      - POSTGRES_PASSWORD=openfga
      - POSTGRES_DB=openfga
      # Same lost+found problem as the `postgres` service — see above.
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - openfga-db-data:/var/lib/postgresql/data

  openfga:
    image: docker.io/openfga/openfga:v1.10.2
    # The datastore is configured with FLAGS, not env vars, on purpose.
    #
    # container-compose injects Docker-link-style variables for every service
    # (OPENFGA_DB_PORT_5432_TCP_ADDR and friends, from the `openfga-db` name).
    # OpenFGA reads its config through viper with an OPENFGA_ prefix, picks
    # those up, and misreads them: with the datastore set via env the server
    # panicked with `storage engine '192.168.64.202' is unsupported` — the
    # database container's IP address. Flags take precedence over env, so they
    # sidestep the collision entirely. Do not move these back to `environment:`.
    #
    # `migrate` is NOT run here: this image is distroless (no /bin/sh), so an
    # entrypoint retry loop like seaweedfs's is not possible, and
    # container-compose has no one-shot service. Run `npm run fga:migrate`
    # after `up` — the server starts fine against an unmigrated database and
    # simply answers 500 (including /healthz) until it has been migrated.
    command:
      - "run"
      - "--datastore-engine=postgres"
      - "--datastore-uri=postgres://openfga:openfga@openfga-db.waggle:5432/openfga?sslmode=disable"
    environment:
      # Default is no authentication at all. waggle reaches OpenFGA over the
      # published loopback port, but anything else on the host could too.
      # (/healthz stays open — only the API requires the key.)
      - OPENFGA_AUTHN_METHOD=preshared
      - OPENFGA_AUTHN_PRESHARED_KEYS=dev-key
      - OPENFGA_LOG_LEVEL=info
    ports:
      # 8080 is taken by browserhive below, so the published port differs from
      # the container port. WAGGLE_FGA_API_URL must use 8090.
      - "127.0.0.1:8090:8080"
    depends_on:
      - openfga-db

  seaweedfs:
    image: docker.io/chrislusf/seaweedfs:4.23
    # The entrypoint also creates the bucket (background retry loop) — there is
    # no separate one-shot init container to order around.
    entrypoint: ["/etc/seaweedfs/entrypoint.sh"]
    environment:
      - BROWSERHIVE_S3_ACCESS_KEY_ID=browserhive
      - BROWSERHIVE_S3_SECRET_ACCESS_KEY=browserhive
      - BROWSERHIVE_S3_BUCKET=browserhive
    # Published for host-side tooling. browserhive reaches this by name, but
    # waggle runs on the host and now reads result manifests and signs URLs
    # against it — 8333 is the S3 API, 8888 the filer UI.
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:8888:8888"
    volumes:
      # Mounted straight out of the submodule rather than copied in by
      # setup.sh: whatever browserhive ships at the pinned version is what runs,
      # and a file added upstream cannot be missed.
      - ./.upstream/browserhive/etc/seaweedfs:/etc/seaweedfs:ro
      - seaweedfs-data:/data

  chromium-1: &worker
    build:
      # The chromium version browserhive itself was tested against — it is a
      # submodule of the submodule, so the pair moves together.
      context: ./.upstream/browserhive/chromium-server-docker
      dockerfile: docker/Dockerfile
      target: production
    mem_limit: 4gb
  chromium-2:
    <<: *worker

  browserhive:
    build:
      context: ./.upstream/browserhive
      dockerfile: Dockerfile.prod
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Name-based wiring via the platform DNS (<service>.waggle).
      - BROWSERHIVE_BROWSER_URLS=http://chromium-1.waggle:9222,http://chromium-2.waggle:9222
      - BROWSERHIVE_S3_ENDPOINT=http://seaweedfs.waggle:8333
      - BROWSERHIVE_S3_REGION=us-east-1
      - BROWSERHIVE_S3_BUCKET=browserhive
      - BROWSERHIVE_S3_ACCESS_KEY_ID=browserhive
      - BROWSERHIVE_S3_SECRET_ACCESS_KEY=browserhive
      # The bundled SeaweedFS has no wildcard DNS for the bucket subdomain, so
      # virtual-hosted-style addressing fails. Path-style makes the bundled
      # stack work out of the box; leave it unset when pointing at AWS.
      - BROWSERHIVE_S3_FORCE_PATH_STYLE=true
      - LOG_LEVEL=info
      # The entrypoint shim polls this before starting the server — depends_on
      # is start order only, and the boot HeadBucket is fatal.
      - WAIT_FOR_S3=http://seaweedfs.waggle:8333
      # The platform DNS publishes AAAA records too, but there is no v6 route
      # between the VMs — resolve v4 first or worker WS URLs land on
      # unreachable v6 addresses.
      - NODE_OPTIONS=--dns-result-order=ipv4first
    depends_on:
      - seaweedfs
      - chromium-1

volumes:
  postgres-data:
  seaweedfs-data:
  openfga-db-data:
