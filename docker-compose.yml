# Apple Container 上の waggle スタック。動かすのは container-compose
# (https://github.com/Mcrich23/Container-Compose —— Homebrew で入れる)。
#
#   container-compose up -d -b     # 全部 build して起動する
#   container-compose down         # 停止する。volume (とその中身) は残る
#
# マシンごとに 1 度だけ要る用意:
#   sudo container system dns create waggle
# project 名と同じ DNS ドメインがあると、container-compose は real-DNS モードに
# 入る: コンテナは <service>.waggle という名前になり、プラットフォームの DNS に
# 登録され、他のコンテナからも **host からも** 引ける —— waggle 自身を host 側で
# 動かしてこのスタックに繋げられるのは、これのおかげ。
# container_name: を足してはならない —— DNS の命名が抑止され、/etc/hosts を書き換える
# 方式に落ちる。そしてその方式は、ここに居る非 root のコンテナ (browserhive, chromium)
# では黙って失敗する。
#
# 上流のソースは git URL からではなく .upstream/browserhive の submodule から来る ——
# `container build` は context のディレクトリしか受け取らないため。submodule には
# browserhive 本体、それが動作確認された版の chromium-server-docker、そして SeaweedFS の
# 設定が入っているので、上流を固定する箇所はちょうど 1 つ —— submodule のポインタだけ。

# project 名を固定する。指定しないと container-compose はディレクトリ名から導くが、
# ここでは project 名が そのまま DNS ドメインになる: `container system dns create <name>`
# で作ったドメインと、下に出てくる `<service>.waggle` というホスト名の両方と
# 一致していなければならない。
name: waggle

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      - POSTGRES_USER=waggle
      - POSTGRES_PASSWORD=waggle
      - POSTGRES_DB=waggle
      # ここでの named volume はフォーマット済みのファイルシステムなので、mount 先には
      # 最初から lost+found が居る。すると initdb が使うことを拒む
      # ("directory exists but is not empty")。クラスタは mount 先の
      # サブディレクトリに置く —— この場合の対処として image 自身が案内している方法。
      - PGDATA=/var/lib/postgresql/data/pgdata
    # host 側の道具 (psql、そして waggle 自身) が名前 (postgres.waggle) でも
    # localhost でも届くように publish している。
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # OpenFGA 自身の保存先。上の `postgres` サービスと共用しないのは意図的。
  #
  # 1 つのインスタンスを共用すると、tuple を waggle のアプリケーション
  # トランザクションの中で書けるかのような思い込みを誘う —— 実際には書けない:
  # OpenFGA へは HTTP API 経由でしか書かず、SQL では書かないので、両方にまたがる
  # トランザクションは存在しない。データベースを分けておくとその境界が目に見える。
  # fga_outbox テーブルが在るのは、まさにそのため。(OpenFGA 自身の docs も専用の
  # データベースを求めている。)
  openfga-db:
    image: docker.io/library/postgres:17-alpine
    environment:
      - POSTGRES_USER=openfga
      - POSTGRES_PASSWORD=openfga
      - POSTGRES_DB=openfga
      # `postgres` サービスと同じ lost+found の問題 —— 上を参照。
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - openfga-db-data:/var/lib/postgresql/data

  openfga:
    image: docker.io/openfga/openfga:v1.10.2
    # datastore を環境変数ではなく **フラグ** で設定しているのは意図的。
    #
    # container-compose は全サービスについて Docker link 形式の変数を注入する
    # (`openfga-db` という名前から OPENFGA_DB_PORT_5432_TCP_ADDR とその仲間)。
    # OpenFGA は設定を viper 経由で OPENFGA_ プレフィックス付きで読むので、それらを
    # 拾ってしまい、読み違える: datastore を env で与えたとき、server は
    # `storage engine '192.168.64.202' is unsupported` と言って panic した ——
    # データベースのコンテナの IP アドレス。フラグは env より優先されるので、
    # 衝突をまるごと回避できる。これらを `environment:` に戻してはならない。
    #
    # `migrate` はここでは走らせていない: この image は distroless で (/bin/sh が無い)、
    # seaweedfs のような entrypoint の再試行ループが書けず、container-compose にも
    # 使い捨てのサービスが無い。`up` のあとに `npm run fga:migrate` を走らせること ——
    # server は未 migrate のデータベース相手でも問題なく起動し、migrate されるまで
    # 単に 500 を返す (/healthz も含めて)。
    command:
      - "run"
      - "--datastore-engine=postgres"
      - "--datastore-uri=postgres://openfga:openfga@openfga-db.waggle:5432/openfga?sslmode=disable"
    environment:
      # 既定では認証が一切無い。waggle は publish された loopback のポート越しに
      # OpenFGA へ届くが、それは host 上の他の何かにとっても同じこと。
      # (/healthz は開いたまま —— キーを要求するのは API だけ。)
      - OPENFGA_AUTHN_METHOD=preshared
      - OPENFGA_AUTHN_PRESHARED_KEYS=dev-key
      - OPENFGA_LOG_LEVEL=info
    ports:
      # 8080 ではなく 8090 で publish しているのは、慣例のポートをどのサービスが
      # 持っているかを host 側で推測せずに済ませるため。WAGGLE_FGA_API_URL は
      # 8090 を使うこと。
      - "127.0.0.1:8090:8080"
    depends_on:
      - openfga-db

  seaweedfs:
    image: docker.io/chrislusf/seaweedfs:4.23
    # entrypoint は bucket の作成も担う (背後で再試行ループを回す) —— 順序を
    # 気にしてやる必要のある、使い捨ての init コンテナは別に無い。
    entrypoint: ["/etc/seaweedfs/entrypoint.sh"]
    environment:
      - BROWSERHIVE_S3_ACCESS_KEY_ID=browserhive
      - BROWSERHIVE_S3_SECRET_ACCESS_KEY=browserhive
      - BROWSERHIVE_S3_BUCKET=browserhive
    # host 側の道具のために publish している。browserhive は名前で届くが、waggle は
    # host 上で動いていて、いまは結果の manifest を読み、URL の署名もここに対して
    # 行う —— 8333 が S3 API、8888 が filer の UI。
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:8888:8888"
    volumes:
      # setup.sh がコピーしてくるのではなく、submodule から直接 mount している:
      # 固定した版の browserhive が同梱しているものが、そのまま動く。上流で足された
      # ファイルを取りこぼすことがない。
      - ./.upstream/browserhive/etc/seaweedfs:/etc/seaweedfs:ro
      - seaweedfs-data:/data

  chromium-1: &worker
    build:
      # browserhive 自身が動作確認された版の chromium —— submodule の submodule なので、
      # この 2 つは一緒に動く。
      context: ./.upstream/browserhive/chromium-server-docker
      dockerfile: docker/Dockerfile
      target: production
    mem_limit: 4gb
  chromium-2:
    <<: *worker

  browserhive:
    build:
      context: ./.upstream/browserhive
      dockerfile: Dockerfile.prod
    ports:
      # gRPC。BrowserHive は v3 で HTTP の提供をやめた。
      - "127.0.0.1:50051:50051"
    environment:
      # プラットフォームの DNS (<service>.waggle) を使った、名前による結線。
      - BROWSERHIVE_BROWSER_URLS=http://chromium-1.waggle:9222,http://chromium-2.waggle:9222
      - BROWSERHIVE_S3_ENDPOINT=http://seaweedfs.waggle:8333
      - BROWSERHIVE_S3_REGION=us-east-1
      - BROWSERHIVE_S3_BUCKET=browserhive
      - BROWSERHIVE_S3_ACCESS_KEY_ID=browserhive
      - BROWSERHIVE_S3_SECRET_ACCESS_KEY=browserhive
      # 同梱の SeaweedFS には bucket のサブドメイン用の wildcard DNS が無いので、
      # virtual-hosted 形式のアドレス指定は失敗する。path 形式なら同梱のスタックが
      # そのまま動く。AWS へ向けるときは設定しないでおくこと。
      - BROWSERHIVE_S3_FORCE_PATH_STYLE=true
      - LOG_LEVEL=info
      # entrypoint の shim が、server を起動する前にここを叩いて待つ —— depends_on は
      # 起動順序でしかなく、起動時の HeadBucket は失敗すると致命的なため。
      - WAIT_FOR_S3=http://seaweedfs.waggle:8333
      # プラットフォームの DNS は AAAA レコードも publish するが、VM 間に v6 の経路は
      # 無い —— v4 を先に引かせないと、worker の WS URL が到達できない v6 アドレスに
      # 着地する。
      - NODE_OPTIONS=--dns-result-order=ipv4first
    depends_on:
      - seaweedfs
      - chromium-1

volumes:
  postgres-data:
  seaweedfs-data:
  openfga-db-data:
