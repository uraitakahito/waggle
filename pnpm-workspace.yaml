# docs-site も同じ workspace に入れる。lockfile を 1 本にしておかないと、
# 「root は pnpm、docs-site は npm」という状態が残り、install が 2 回要る。
packages:
  - "docs-site"

# pnpm 11 は依存の lifecycle script を既定で実行しない。ここに挙がっているのは
# 「実行してよいか」を pnpm に聞かれたパッケージで、**どちらも false でよい**
# ことを実測で確かめてある。
#
# 直感に反するが、この 2 つの postinstall は必須ではない:
#
#   @bufbuild/buf — bin/buf は platform 別のパッケージ (ここでは
#                   @bufbuild/buf-darwin-arm64) を **実行時に** 解決する Node の
#                   シム。platform パッケージは optional dependency として
#                   postinstall と無関係に入るので、false でも buf は動く。
#   esbuild       — docs-site (Astro) 経由。同じ形で、bin/esbuild が
#                   @esbuild/<platform> を実行時に解決する。
#
# 反証で確かめた手順: 値を false にし、node_modules を消し、**ストアも分けて**
# 冷えた install をやり直したうえで、`buf --version` と `astro build` が通ること
# を見た (ストアを消さないと、前回ビルド済みのものが link され直して意味が無い)。
#
# postinstall がやるのはシムを実体の binary に置き換える最適化で、起動が少し
# 速くなる。それと引き換えに第三者の install script を走らせる価値は無いと
# 判断して false にしている。**増やすときは同じ手順で「本当に要るのか」を
# 確かめること** —— 要る/要らないは直感では当たらない。
allowBuilds:
  "@bufbuild/buf": false
  esbuild: false
  protobufjs: false

# npm の `overrides` の移設先。pnpm 11 は package.json の `overrides` を読まず、
# 書いても無視する (= 脆弱性修正が黙って失われる)。
#
# **脆弱性対応の下限は「修正版そのもの」に置くこと。** override は範囲を狭める
# だけで lockfile を進める力は無いので、下限が脆弱な版を許していると、override が
# あるのに古い版が居座り続ける。brace-expansion の勧告の修正版は >=5.0.9 で、
# 移行前の指定 (^5.0.8) は脆弱な版そのものを許していた。
#
# js-yaml (旧 ^4.3.0) は移していない。依存グラフに 1 箇所も無く、何もしていな
# かったため。
overrides:
  brace-expansion: "^5.0.9"
  axios: "^1.18.1"
